name: 境外涉华监测日报

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python generate.py

      - name: Commit & push (GitHub Pages 备份)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "daily digest $(date +'%Y-%m-%d' -d '+8 hours')" || echo "no changes"
          git push

      - name: Deploy to Gitee Pages (国内镜像)
        if: ${{ secrets.GITEE_TOKEN != '' && secrets.GITEE_USERNAME != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
        run: |
          cd docs
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy $(date +'%Y-%m-%d' -d '+8 hours')"
          git push -f "https://$GITEE_USERNAME:$GITEE_TOKEN@gitee.com/$GITEE_USERNAME/china-media-digest.git" master 2>&1 | tail -3
          echo "--- 触发 Gitee Pages 重建 ---"
          curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_USERNAME/china-media-digest/pages/builds?access_token=$GITEE_TOKEN"
